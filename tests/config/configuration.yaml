# Test configuration used by .github/workflows/validate.yml: Home Assistant's configuration check must accept
# every blueprint in this repository. Placeholder addresses only; no real devices.
homeassistant:
  name: Blueprint test
  time_zone: UTC
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
logbook:
persistent_notification:
notify:
template:
  - use_blueprint:
      path: sudomanaged/internet_connection.yaml
      input:
        ip_sensor: sensor.myip
        main_addresses: "203.0.113."
        main_name: Fiber
        backup_name: Starlink
    name: Internet connection
    unique_id: internet_connection_test
automation: !include automations.yaml
